<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Darzi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a tailor's worktable. Paper ground, ink type, one measuring-tape yellow. Product grid, then a two-column product page. */
:root {
  --paper: #f5f6f3; --card: #ffffff; --ink: #10141b; --muted: #5a6370; --line: #d8dbd4;
  --tape: #f2c230; --tape-ink: #1d1803; --ok: #23764a; --bad: #b3392c; --chalk: #2c5a86;
  --display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --data: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--body); }
[hidden] { display: none !important; }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--chalk); outline-offset: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { position: sticky; top: 0; z-index: 5; background: var(--paper); }
.top .wrap { display: flex; align-items: center; gap: 14px; padding-block: 12px; }
.brand { font: 700 26px/1 var(--display); letter-spacing: -.02em; text-decoration: none; display: inline-flex; align-items: center; min-height: 44px; }
.nav { display: flex; gap: 2px; margin-left: 8px; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 6px 12px; border-radius: 6px; text-decoration: none; color: var(--muted); font-weight: 500; white-space: nowrap; }
.nav a[aria-current="page"] { color: var(--ink); background: #e9ebe5; }
.cart-link { flex: none; display: inline-flex; gap: 8px; align-items: center; min-height: 44px; padding: 7px 14px; border: 1px solid var(--ink); border-radius: 999px; text-decoration: none; font-weight: 600; }
.cart-link b { font: 500 13px/1 var(--data); background: var(--tape); color: var(--tape-ink); border-radius: 999px; padding: 3px 7px; }
/* The measuring tape: centimetre ticks, a longer one every five. */
.tape { height: 14px; border-block: 1px solid var(--tape-ink); background-color: var(--tape);
  background-image: repeating-linear-gradient(90deg, var(--tape-ink) 0 1px, transparent 1px 10px), repeating-linear-gradient(90deg, var(--tape-ink) 0 1px, transparent 1px 50px);
  background-size: auto 6px, auto 100%; background-repeat: repeat-x; }

main { padding-block: 26px 60px; }
h1 { font: 700 clamp(28px, 5vw, 44px)/1.05 var(--display); letter-spacing: -.025em; margin: 0; text-wrap: balance; }
h2 { font: 700 20px/1.2 var(--display); margin: 0; }
.lede { color: var(--muted); max-width: 56ch; margin: 10px 0 0; }
.intro { display: flex; flex-direction: column; gap: 4px; margin-bottom: 24px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px; }
.item { display: flex; flex-direction: column; gap: 8px; text-decoration: none; min-width: 0; }
.item .pic { background: var(--card); border: 1px solid var(--line); border-radius: 4px; aspect-ratio: 1; display: grid; place-items: center; padding: 10%; }
.item .pic svg { width: 100%; height: 100%; }
.item:hover .pic { border-color: var(--ink); }
.item .name { font-weight: 600; }
.meta { display: flex; justify-content: space-between; gap: 8px; font: 13px/1.4 var(--data); color: var(--muted); }
.price { font: 500 15px/1.4 var(--data); color: var(--ink); }
.dots { display: flex; gap: 5px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(16, 20, 27, .3); }

.product { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; align-items: start; }
.product .pic { background: var(--card); border: 1px solid var(--line); border-radius: 4px; aspect-ratio: 1; display: grid; place-items: center; padding: 9%; }
.product .pic svg { width: 100%; height: 100%; }
.info { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.crumb { font: 13px/1 var(--data); color: var(--muted); text-decoration: none; display: inline-flex; align-items: center; min-height: 44px; align-self: flex-start; margin-block: -12px; }
.label { font: 500 12px/1 var(--data); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; display: block; }
.swatches, .sizes { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(16, 20, 27, .35); padding: 0; }
.sw[aria-checked="true"] { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
.sz { min-width: 56px; min-height: 46px; padding: 9px 12px; border: 1px solid var(--line); background: var(--card); border-radius: 4px; font: 500 15px/1 var(--data); }
.sz[aria-checked="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.sz:disabled { color: #a9aeb5; text-decoration: line-through; cursor: not-allowed; }
.sz.suggested { box-shadow: inset 0 -3px 0 var(--ok); }
.measures { margin: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 4px; background: var(--card); }
.measures div { padding: 9px 10px; border-left: 1px solid var(--line); min-width: 0; }
.measures div:first-child { border-left: 0; }
.measures dt { font: 11px/1.2 var(--data); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.measures dd { margin: 4px 0 0; font: 500 17px/1.1 var(--data); font-variant-numeric: tabular-nums; }
.measures dd small { font-size: 11px; color: var(--muted); font-weight: 400; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { min-height: 48px; padding: 12px 18px; border-radius: 4px; border: 1px solid var(--ink); background: transparent; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--tape); border-color: var(--tape-ink); color: var(--tape-ink); }
.btn.solid { background: var(--ink); color: var(--paper); }
.btn.small { padding: 6px 10px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.note { font-size: 14px; color: var(--muted); margin: 0; max-width: 56ch; }
.note.ok { color: var(--ok); font-weight: 500; }

.cart { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 32px; align-items: start; }
.lines { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.line { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding-block: 12px; border-bottom: 1px solid var(--line); }
.line .thumb { width: 64px; height: 64px; background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 6px; }
.line .thumb svg { width: 100%; height: 100%; }
.line .what { min-width: 0; }
.line .what a { display: inline-block; padding-block: 4px; }
.line .what span { display: block; font: 13px/1.4 var(--data); color: var(--muted); }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 4px; background: var(--card); }
.qty button { width: 44px; height: 44px; border: 0; background: none; font-size: 18px; line-height: 1; }
.qty output { min-width: 26px; text-align: center; font: 500 15px/1 var(--data); }
.line .right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.totals { margin: 14px 0 0; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font: 15px/1.4 var(--data); }
.totals dt { color: var(--muted); } .totals dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.totals .sum { font-weight: 500; font-size: 18px; color: var(--ink); border-top: 1px solid var(--ink); padding-top: 8px; }
form.order { display: flex; flex-direction: column; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 18px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 14px; font-weight: 500; }
.field input, .field textarea { padding: 10px 11px; border: 1px solid #b9bdb5; border-radius: 4px; background: #fff; width: 100%; }
.field .err { color: var(--bad); font-size: 13px; }
.pay { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; font-size: 14px; }
pre.slip { margin: 0; padding: 14px; background: var(--card); border: 1px dashed #9aa093; border-radius: 4px; font: 13.5px/1.5 var(--data); white-space: pre-wrap; overflow-wrap: anywhere; user-select: all; -webkit-user-select: all; }
.stack { display: flex; flex-direction: column; gap: 16px; max-width: 640px; }
.empty { padding: 40px 0; color: var(--muted); }

footer { border-top: 1px solid var(--line); padding-block: 18px 30px; color: var(--muted); font-size: 14px; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-weight: 500; z-index: 30; max-width: calc(100% - 32px); }
.fitting { position: fixed; inset: 0; z-index: 20; background: #000; }
.fitting iframe { width: 100%; height: 100%; border: 0; display: block; }

@media (max-width: 760px) {
  body { font-size: 16px; }
  /* Header in two rows: name and cart, then the four departments as equal tabs across the screen. */
  .top .wrap { flex-wrap: wrap; gap: 0 8px; padding-block: 6px 0; }
  .brand { font-size: 23px; flex: 1 1 auto; }
  .nav { order: 3; flex: 1 1 100%; margin: 4px 0 6px; overflow: visible; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
  .nav a { justify-content: center; padding-inline: 4px; }
  main { padding-block: 18px 40px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; }
  .product, .cart { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .product .pic { aspect-ratio: 4 / 3; padding: 4% 16%; }
  .measures { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .measures div:nth-child(3) { border-left: 0; } .measures div:nth-child(n+3) { border-top: 1px solid var(--line); }
  /* The two actions stay within thumb reach at the bottom of the screen while the page scrolls. */
  .btns.actions { position: sticky; bottom: 0; z-index: 4; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: var(--paper); border-top: 1px solid var(--line); flex-wrap: nowrap; }
  .btns.actions .btn { flex: 1 1 0; min-width: 0; padding-inline: 8px; }
  .line { grid-template-columns: 56px minmax(0, 1fr) auto; gap: 10px; }
  .line .thumb { width: 56px; height: 56px; }
  form.order { padding: 16px; }
  form.order .btn, .stack .btns .btn { width: 100%; }
  .toast { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
}
@media (max-width: 340px) { .grid { gap: 12px 8px; } .item .name { font-size: 15px; } .sz { min-width: 50px; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/" id="brand">Darzi</a>
    <nav class="nav" aria-label="Departments" id="nav"></nav>
    <a class="cart-link" href="#/cart">Cart <b id="cartCount">0</b></a>
  </div>
  <div class="tape" aria-hidden="true"></div>
</header>
<main class="wrap" id="view"></main>
<footer><div class="wrap"><span>Demo shop with example products and size charts. Orders are requests, paid in cash on delivery.</span><a href="admin.html">Shop admin</a></div></footer>
<div class="toast" id="toast" role="status" hidden></div>
<div class="fitting" id="fitting" hidden><iframe id="fitFrame" title="Virtual try-on" allow="camera; fullscreen"></iframe></div>

<script src="store-data.js"></script>
<script>
(() => {
  "use strict";
  const S = window.DarziStore, esc = S.esc, $ = (id) => document.getElementById(id);
  const view = $("view"), settings = S.settings();
  let products = S.products(), cart = S.cart();
  const pick = {};            // per product: chosen colour and size, and the size the try-on suggested
  const GROUPS = [["", "All"], ["men", "Men"], ["women", "Women"], ["kids", "Kids"]];

  document.title = settings.name; $("brand").textContent = settings.name;

  /* ----- helpers ----- */
  const product = (id) => products.find((p) => p.id === id);
  const stockOf = (p, size) => Math.max(0, Number((p.stock || {})[size]) || 0);
  const inCart = (p, size) => cart.filter((l) => l.id === p.id && l.size === size).reduce((n, l) => n + l.qty, 0);
  const state = (p) => pick[p.id] || (pick[p.id] = { colour: p.colours[0].hex, size: (p.chart.find((r) => stockOf(p, r.id) > 0) || p.chart[0]).id, suggested: null });
  const colourName = (p, hex) => (p.colours.find((c) => c.hex === hex) || { name: hex }).name;
  function toast(text) { const t = $("toast"); t.textContent = text; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2600); }
  function saveCart() { S.saveCart(cart); $("cartCount").textContent = cart.reduce((n, l) => n + l.qty, 0); }
  function totals() {
    const sub = cart.reduce((n, l) => { const p = product(l.id); return n + (p ? p.price * l.qty : 0); }, 0);
    const delivery = !cart.length || sub >= settings.freeOver ? 0 : settings.delivery;
    return { sub, delivery, total: sub + delivery };
  }
  function addToCart(p, size, colour) {
    if (inCart(p, size) >= stockOf(p, size)) { toast(`Only ${stockOf(p, size)} of size ${size} in stock`); return false; }
    const line = cart.find((l) => l.id === p.id && l.size === size && l.colour === colour);
    if (line) line.qty++; else cart.push({ id: p.id, size, colour, qty: 1 });
    saveCart(); toast(`Added ${p.name}, size ${size}`); return true;
  }

  /* ----- pages ----- */
  function nav(group) {
    $("nav").innerHTML = GROUPS.map(([g, label]) => `<a href="#/${g}" ${g === group ? 'aria-current="page"' : ""}>${label}</a>`).join("");
  }
  function pageList(group) {
    nav(group);
    const list = products.filter((p) => !group || p.group === group);
    view.innerHTML = `<div class="intro"><h1>${esc(settings.tagline)}</h1><p class="lede">T-shirts, shirts, kurtas and trousers, each tried on with your phone's camera and drawn at its real measurements. Measure yourself once and the shop suggests your size.</p></div>
      <div class="grid">${list.map((p) => `<a class="item" href="#/p/${esc(p.id)}">
        <div class="pic">${S.shirtSvg(p, p.colours[0].hex)}</div>
        <div class="name">${esc(p.name)}</div>
        <div class="meta"><span class="price">${S.money(p.price)}</span><span class="dots">${p.colours.map((c) => `<i style="background:${esc(c.hex)}" title="${esc(c.name)}"></i>`).join("")}</span></div>
        <div class="meta"><span>${esc(p.chart[0].id)} to ${esc(p.chart[p.chart.length - 1].id)}</span></div></a>`).join("") || '<p class="empty">Nothing here yet.</p>'}</div>`;
  }
  function pageProduct(id) {
    const p = product(id); if (!p) { location.hash = "#/"; return; }
    nav(p.group);
    const st = state(p), row = p.chart.find((r) => r.id === st.size) || p.chart[0], left = stockOf(p, row.id) - inCart(p, row.id);
    view.innerHTML = `<div class="product">
      <div class="pic">${S.shirtSvg(p, st.colour, { label: p.name + " in " + colourName(p, st.colour) })}</div>
      <div class="info">
        <a class="crumb" href="#/${esc(p.group)}">&larr; ${esc(p.group[0].toUpperCase() + p.group.slice(1))}</a>
        <div><h1>${esc(p.name)}</h1><p class="price" style="font-size:20px;margin:8px 0 0">${S.money(p.price)}</p></div>
        <p class="note" style="color:var(--ink)">${esc(p.desc || "")}</p>
        <p class="note" id="fabricLine">Fabric: ${esc(S.fabricText(p))}</p>
        <div><span class="label">Colour: ${esc(colourName(p, st.colour))}</span><div class="swatches" role="radiogroup" aria-label="Colour">${p.colours.map((c) => `<button class="sw" role="radio" aria-checked="${c.hex === st.colour}" aria-label="${esc(c.name)}" title="${esc(c.name)}" style="background:${esc(c.hex)}" data-act="colour" data-v="${esc(c.hex)}"></button>`).join("")}</div></div>
        <div><span class="label">Size</span><div class="sizes" role="radiogroup" aria-label="Size">${p.chart.map((r) => `<button class="sz${r.id === st.suggested ? " suggested" : ""}" role="radio" aria-checked="${r.id === st.size}" data-act="size" data-v="${esc(r.id)}" ${stockOf(p, r.id) ? "" : "disabled"}>${esc(r.id)}</button>`).join("")}</div>
          ${st.suggested ? `<p class="note ok" style="margin-top:8px">Your measured size is ${esc(st.suggested)}.</p>` : ""}</div>
        <dl class="measures" aria-label="Measurements of size ${esc(row.id)}">
          ${S.fields(S.typeOf(p)).map((f) => `<div><dt>${f.label}</dt><dd>${f.round ? row[f.k] * 2 : row[f.k]} <small>cm${f.round ? " round" : ""}</small></dd></div>`).join("")}
        </dl>
        <div class="btns actions"><button class="btn primary" data-act="tryon">Try it on</button><button class="btn solid" data-act="add" ${left > 0 ? "" : "disabled"}>${left > 0 ? "Add to cart" : "Out of stock"}</button></div>
        <p class="note">Try it on uses your camera. The picture stays on your phone; nothing is uploaded or saved.</p>
      </div></div>`;
    view.dataset.pid = p.id;
  }
  function pageCart(errors, values) {
    nav(null);
    if (!cart.length) { view.innerHTML = `<h1>Your cart</h1><p class="empty">Your cart is empty. <a href="#/">See the collection</a>.</p>`; return; }
    const t = totals(), v = values || {}, e = errors || {};
    const field = (name, label, type, extra) => `<div class="field"><label for="f_${name}">${label}</label>${type === "area" ? `<textarea id="f_${name}" name="${name}" rows="2" ${extra || ""}>${esc(v[name] || "")}</textarea>` : `<input id="f_${name}" name="${name}" type="${type}" value="${esc(v[name] || "")}" ${extra || ""}>`}${e[name] ? `<span class="err">${e[name]}</span>` : ""}</div>`;
    view.innerHTML = `<h1>Your cart</h1><div class="cart" style="margin-top:20px">
      <div><div class="lines">${cart.map((l, i) => { const p = product(l.id); if (!p) return ""; return `<div class="line">
          <div class="thumb">${S.shirtSvg(p, l.colour)}</div>
          <div class="what"><a href="#/p/${esc(p.id)}" style="font-weight:600;text-decoration:none">${esc(p.name)}</a><span>${esc(colourName(p, l.colour))} · size ${esc(l.size)}</span><span>${S.money(p.price)} each</span></div>
          <div class="right"><div class="qty"><button data-act="dec" data-i="${i}" aria-label="One fewer">&minus;</button><output>${l.qty}</output><button data-act="inc" data-i="${i}" aria-label="One more">+</button></div><span class="price">${S.money(p.price * l.qty)}</span></div></div>`; }).join("")}</div>
        <dl class="totals"><dt>Subtotal</dt><dd>${S.money(t.sub)}</dd><dt>Delivery${t.delivery ? "" : " (free over " + S.money(settings.freeOver) + ")"}</dt><dd>${t.delivery ? S.money(t.delivery) : "Free"}</dd><dt class="sum">Total</dt><dd class="sum">${S.money(t.total)}</dd></dl></div>
      <form class="order" id="orderForm" novalidate>
        <h2>Delivery details</h2>
        ${field("name", "Full name", "text", 'autocomplete="name"')}
        ${field("phone", "Mobile number", "tel", 'autocomplete="tel" inputmode="tel" placeholder="03XX XXXXXXX"')}
        ${field("address", "Address", "area", 'autocomplete="street-address"')}
        ${field("city", "City", "text", 'autocomplete="address-level2"')}
        ${field("notes", "Note for the shop (optional)", "area")}
        <div class="pay"><strong>Cash on delivery</strong><span>Pay ${S.money(t.total)} when it arrives.</span></div>
        <button class="btn primary" type="submit">Place order</button>
      </form></div>`;
  }
  function slip(o) {
    return [`${settings.name} order ${o.no}`, "", ...o.lines.map((l) => `${l.qty} x ${l.name} | ${l.colour} | size ${l.size} | ${S.money(l.price * l.qty)}`), "",
      `Subtotal: ${S.money(o.sub)}`, `Delivery: ${o.delivery ? S.money(o.delivery) : "Free"}`, `Total (cash on delivery): ${S.money(o.total)}`, "",
      `Name: ${o.name}`, `Mobile: ${o.phone}`, `Address: ${o.address}, ${o.city}`, ...(o.notes ? [`Note: ${o.notes}`] : [])].join("\n");
  }
  function pageDone(no) {
    nav(null);
    const o = S.orders().find((x) => x.no === no); if (!o) { location.hash = "#/"; return; }
    const text = slip(o), wa = String(settings.whatsapp || "").replace(/\D/g, "");
    view.innerHTML = `<div class="stack"><h1>Order ${esc(o.no)} is ready to send</h1>
      <p class="lede" style="margin:0">${wa ? "Send it to the shop on WhatsApp to confirm. You pay in cash when it arrives." : "This demo shop has no order inbox yet. Copy the order and send it to the shop to confirm."}</p>
      <pre class="slip" id="slip">${esc(text)}</pre>
      <div class="btns">${wa ? `<a class="btn primary" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${encodeURIComponent(text)}">Send on WhatsApp</a>` : ""}<button class="btn${wa ? "" : " primary"}" data-act="copy">Copy order</button><a class="btn" href="#/">Keep shopping</a></div></div>`;
  }

  /* ----- try-on overlay ----- */
  let fitting = null;
  function openTryOn(p) {
    fitting = p; const f = $("fitFrame"); $("fitting").hidden = false; document.body.style.overflow = "hidden";
    f.src = "try-on-bench.html?v=20#embed";
  }
  function closeTryOn() { $("fitting").hidden = true; $("fitFrame").src = "about:blank"; document.body.style.overflow = ""; fitting = null; }
  window.addEventListener("message", (ev) => {
    if (ev.origin !== location.origin || !ev.data || typeof ev.data.type !== "string" || !fitting) return;
    const p = fitting, st = state(p), d = ev.data;
    if (d.type === "tryon:ready") {
      $("fitFrame").contentWindow.postMessage({ type: "tryon:config", product: { name: p.name, type: S.typeOf(p), chart: p.chart, colours: p.colours, colour: st.colour, size: st.size, pattern: p.pattern, fabric: S.fabricOf(p), print: p.print || null } }, location.origin);
      return;
    }
    if (d.size && p.chart.some((r) => r.id === d.size)) st.size = d.size;
    if (d.colour && p.colours.some((c) => c.hex === d.colour)) st.colour = d.colour;
    if (d.suggested && p.chart.some((r) => r.id === d.suggested)) st.suggested = d.suggested;
    if (d.type === "tryon:add") { addToCart(p, st.size, st.colour); closeTryOn(); route(); }
    else if (d.type === "tryon:close") { closeTryOn(); route(); }
  });

  /* ----- events ----- */
  view.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-act]"); if (!b) return;
    const act = b.dataset.act, p = product(view.dataset.pid);
    if (act === "colour" && p) { state(p).colour = b.dataset.v; route(); }
    else if (act === "size" && p) { state(p).size = b.dataset.v; route(); }
    else if (act === "add" && p) { addToCart(p, state(p).size, state(p).colour); route(); }
    else if (act === "tryon" && p) openTryOn(p);
    else if (act === "inc" || act === "dec") {
      const l = cart[Number(b.dataset.i)], pr = l && product(l.id); if (!l) return;
      if (act === "inc") { if (pr && inCart(pr, l.size) >= stockOf(pr, l.size)) { toast("No more of that size in stock"); return; } l.qty++; }
      else if (--l.qty <= 0) cart.splice(Number(b.dataset.i), 1);
      saveCart(); route();
    } else if (act === "copy") {
      const text = $("slip").textContent;
      (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => toast("Order copied"), () => { const r = document.createRange(); r.selectNodeContents($("slip")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Order selected: copy it"); });
    }
  });
  view.addEventListener("submit", (ev) => {
    if (ev.target.id !== "orderForm") return; ev.preventDefault();
    const v = Object.fromEntries(new FormData(ev.target).entries()), e = {};
    for (const k in v) v[k] = String(v[k]).trim();
    if (v.name.length < 3) e.name = "Enter your full name.";
    if (v.phone.replace(/\D/g, "").length < 10) e.phone = "Enter a mobile number the rider can call, at least 10 digits.";
    if (v.address.length < 8) e.address = "Enter the full delivery address.";
    if (v.city.length < 2) e.city = "Enter the city.";
    if (Object.keys(e).length) { pageCart(e, v); const first = document.querySelector(".err"); if (first) first.parentElement.querySelector("input, textarea").focus(); return; }
    const t = totals(), d = new Date(), no = "D" + String(d.getFullYear()).slice(2) + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0") + "-" + String(Math.floor(Math.random() * 900) + 100);
    const order = { no, at: d.toISOString(), ...v, ...t, lines: cart.map((l) => { const p = product(l.id); return { id: l.id, name: p.name, colour: colourName(p, l.colour), size: l.size, qty: l.qty, price: p.price }; }) };
    const all = S.orders(); all.unshift(order); S.saveOrders(all);
    // Take the ordered pieces out of stock, so the shop's own numbers stay right on this device.
    for (const l of cart) { const p = product(l.id); if (p && p.stock) p.stock[l.size] = Math.max(0, stockOf(p, l.size) - l.qty); }
    S.saveProducts(products);
    cart = []; saveCart(); location.hash = "#/done/" + no;
  });

  function route() {
    const h = location.hash.replace(/^#\/?/, ""), parts = h.split("/");
    if (parts[0] === "p") pageProduct(decodeURIComponent(parts[1] || ""));
    else if (parts[0] === "cart") pageCart();
    else if (parts[0] === "done") pageDone(parts[1]);
    else pageList(["men", "women", "kids"].includes(parts[0]) ? parts[0] : "");
  }
  window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });
  saveCart(); route();
})();
</script>
</body>
</html>
